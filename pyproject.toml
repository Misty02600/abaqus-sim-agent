[project]
name = "abaqus-sim-agent"
version = "0.1.0"
description = "A Pydantic coding agent for Abaqus simulation workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
authors = [
  { name = "Misty02600", email = "xiao02600@gmail.com" },
]
dependencies = [
  "arize-phoenix-otel==0.17.1",
  "beautifulsoup4>=4.14,<5",
  "filelock>=3.20,<4",
  "lxml>=6.0,<7",
  "numpy>=2.5,<3",
  "onnxruntime>=1.29,<2",
  "opentelemetry-api==1.44.0",
  "opentelemetry-instrumentation-threading==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "openinference-instrumentation-pydantic-ai==0.1.27",
  "platformdirs>=4.4,<5",
  "pydantic>=2.12,<3",
  "pydantic-ai-harness[skills]==0.36.0",
  "pydantic-ai-slim[anthropic,bedrock,bedrock-mantle,cerebras,cohere,crusoe,google,groq,huggingface,mistral,openai,openrouter,snowflake,typesafe,zai]==2.51.0",
  "requests>=2.34,<3",
  "tokenizers>=0.23,<1",
]

[project.optional-dependencies]
web = [
  "fastapi==0.116.1",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "uvicorn==0.52.4",
  "pillow>=11,<13",
]
static-preflight = [
  "basedpyright>=1.39.0,<2.0.0",
]

[project.scripts]
abaqus-sim-agent = "abaqus_sim_agent.coding.cli:main"
abaqus-sim-agent-web = "abaqus_sim_agent.web.cli:main"
abaqus-sim-agent-catalog = "abaqus_sim_agent.api_catalog.build:main"

[project.urls]
Homepage = "https://github.com/Misty02600/abaqus-sim-agent"
Issues = "https://github.com/Misty02600/abaqus-sim-agent/issues"
Repository = "https://github.com/Misty02600/abaqus-sim-agent.git"

[build-system]
requires = [
  "uv_build>=0.11.0,<0.12.0",
]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "abaqus_sim_agent"

[dependency-groups]
dev = [
  "commitizen>=4.16.0,<5.0.0",
  "git-cliff>=2.11.0,<3.0.0",
  "prek>=0.3.0,<1.0.0",
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "type" },
]
eval = [
  "arize-phoenix-client==3.5.0",
  "pydantic-evals==2.51.0",
]
lint = [
  "ruff>=0.15.0,<1.0.0",
]
test = [
  "pytest>=9.0.0,<10.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
]
type = [
  "basedpyright>=1.39.0,<2.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
annotated_tag = true
major_version_zero = true
