[pytest]
addopts =
    --import-mode=importlib
    --strict-markers
    --tb=short
    -ra
    -m "not abaqus and not local_assets and not live_model"
testpaths = tests
markers =
    abaqus: requires a local licensed Abaqus installation
    local_assets: requires private local source files, indexes, or recorded runtime data
    live_model: explicitly invokes an external model provider
