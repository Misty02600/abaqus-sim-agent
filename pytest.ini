[pytest]
addopts =
    --import-mode=importlib
    --strict-markers
    --tb=short
    -ra
    -m "not abaqus and not evaluation and not component"
testpaths = tests
markers =
    abaqus: requires a local licensed Abaqus installation
    component: lower-level component regression that is not part of the default product smoke suite
    evaluation: frozen evaluator, benchmark, or research-regression coverage
